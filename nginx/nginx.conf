worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile     on;
    keepalive_timeout 65;

    # NOTE: no hardcoded "resolver" — Docker uses 127.0.0.11 but podman/aardvark
    # uses the network gateway IP. Upstream names are resolved at startup via
    # /etc/resolv.conf, which works on both engines (and over IPv6).

    # Upstream API (FastAPI)
    upstream api_upstream {
        server api:8000;
        keepalive 16;
    }

    server {
        listen 80;
        listen [::]:80;   # IPv6
        server_name _;

        # ── API proxy ───────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        "";   # keepalive

            # SSE: disable buffering so events stream immediately
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;

            proxy_next_upstream error timeout;
        }

        # Health check passthrough
        location /health {
            proxy_pass http://api_upstream;
        }

        # ── React SPA ───────────────────────────────────────────────────
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri /index.html;
        }

        # Serve static assets with long cache
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            root    /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
