version: "3.9"

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: odd_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-odd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oddpassword}
      POSTGRES_DB:       ${POSTGRES_DB:-odd_automation}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odd}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: odd_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  # ── Alembic migrations (run once) ─────────────────────────────────────────
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: odd_migrate
    command: alembic upgrade head
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ── FastAPI API ───────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: odd_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - dumps_incoming:/app/dumps/incoming
      - dumps_processed:/app/dumps/processed
      - exports:/app/exports
    ports:
      - "8000:8000"       # direct access during development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # ── Celery worker ─────────────────────────────────────────────────────────
  # ── Celery Heavy Worker (Long Running Operations Pool) ────────────────────
  worker_heavy:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: odd_worker_heavy
    # Dedicated resources focused only on file ingestion and scheduled evaluations
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2 -Q processing,scheduler
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - dumps_incoming:/app/dumps/incoming
      - dumps_processed:/app/dumps/processed
      - exports:/app/exports
    restart: unless-stopped

  # ── Celery Light Worker (Fast Telemetry Operations Pool) ───────────────────
  worker_light:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: odd_worker_light
    # Focused on instant real-time UI SSE broadcasts and quick excel generations
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4 -Q default,export,notifications
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - exports:/app/exports
    restart: unless-stopped

  # ── Celery beat (scheduler) ───────────────────────────────────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: odd_beat
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      - worker_heavy
      - worker_light
    restart: unless-stopped

  # ── Nginx + React frontend ────────────────────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: odd_nginx
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
  dumps_incoming:
  dumps_processed:
  exports:
